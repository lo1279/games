<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#0a0b12">
    <title>俄罗斯方块 - TETRIS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶部状态与品牌栏 -->
    <header class="game-header">
        <div class="header-content">
            <h1 class="game-title">TETRIS</h1>
            <div class="header-actions">
                <button id="btn-sound" class="icon-btn" title="开关音效">🔊</button>
                <button id="btn-pause" class="icon-btn" title="暂停游戏">⏸</button>
                <button id="btn-restart-top" class="icon-btn" title="重新开始">🔄</button>
            </div>
        </div>
    </header>

    <!-- 游戏舞台与仪表盘容器 -->
    <main class="game-wrapper">
        
        <!-- 左侧/移动端左侧：暂存与消除统计 -->
        <aside class="side-panel side-left">
            <div class="glass-box box-hold">
                <span class="box-title">暂存 (HOLD)</span>
                <canvas id="hold-canvas" class="preview-canvas"></canvas>
            </div>
            <div class="glass-box box-high-score">
                <span class="box-title">最高分</span>
                <span id="high-score" class="box-value highlight">0</span>
            </div>
            <div class="glass-box box-lines">
                <span class="box-title">消除行</span>
                <span id="lines" class="box-value">0</span>
            </div>
        </aside>

        <!-- 中间游戏主舞台 -->
        <section class="board-container" id="board-container">
            <canvas id="board"></canvas>

            <!-- 状态遮罩层 (准备 / 暂停 / 结束) -->
            <div id="overlay" class="overlay">
                <h2 id="overlay-title" class="overlay-title">俄罗斯方块</h2>
                <p id="overlay-subtitle" class="overlay-subtitle">按空格键或点击下方按钮开始</p>
                <button id="btn-start" class="btn btn-primary overlay-btn">🎮 开始游戏</button>
            </div>
        </section>

        <!-- 右侧/移动端右侧：下一块与分数等级 -->
        <aside class="side-panel side-right">
            <div class="glass-box box-next">
                <span class="box-title">下一个 (NEXT)</span>
                <canvas id="next-canvas" class="preview-canvas"></canvas>
            </div>
            <div class="glass-box box-score">
                <span class="box-title">当前得分</span>
                <span id="score" class="box-value highlight">0</span>
            </div>
            <div class="glass-box box-level">
                <span class="box-title">等级</span>
                <span id="level" class="box-value">1</span>
            </div>
        </aside>

    </main>

    <!-- 移动端专属人体工程学虚拟手柄 -->
    <section class="touch-controller">
        <!-- 左手区：位移与加速 -->
        <div class="dpad-cluster">
            <button id="ctrl-left" class="touch-btn" aria-label="向左移动">◀</button>
            <button id="ctrl-down" class="touch-btn" aria-label="加速下落">▼</button>
            <button id="ctrl-right" class="touch-btn" aria-label="向右移动">▶</button>
        </div>
        <!-- 右手区：暂存、旋转、瞬降 -->
        <div class="action-cluster">
            <button id="ctrl-hold" class="touch-btn btn-action-hold" aria-label="暂存方块">暂存</button>
            <button id="ctrl-rotate" class="touch-btn btn-action-rotate" aria-label="顺时针旋转">旋转 ↻</button>
            <button id="ctrl-drop" class="touch-btn btn-action-drop" aria-label="硬降到底">瞬降 ⤓</button>
        </div>
    </section>

    <!-- 桌面端键盘操作指引 (手机端自动隐藏) -->
    <footer class="controls-guide">
        <div class="controls-guide-title">键盘快捷操作指南</div>
        <div class="controls-grid">
            <div><span class="key-badge">←</span> / <span class="key-badge">A</span> 左移</div>
            <div><span class="key-badge">→</span> / <span class="key-badge">D</span> 右移</div>
            <div><span class="key-badge">↑</span> / <span class="key-badge">W</span> 旋转</div>
            <div><span class="key-badge">↓</span> / <span class="key-badge">S</span> 软降加速</div>
            <div><span class="key-badge">Space</span> 硬降到底</div>
            <div><span class="key-badge">C</span> / <span class="key-badge">Shift</span> 暂存</div>
        </div>
    </footer>

    <!-- 游戏脚本入口（兼容直接双击与本地服务器） -->
    <script src="game.bundle.js"></script>
</body>
</html>
