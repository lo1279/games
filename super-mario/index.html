<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12131c">
  <title>超级马里奥兄弟 (Super Mario Bros FC) - 经典红白机街机典藏版</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 游戏主舞台 -->
  <main class="arcade-stage">

    <!-- 红白机 / 街机复古框体外壳 -->
    <div class="famicom-console" id="famicomConsole">
      
      <!-- 机身顶部铭牌与状态栏 -->
      <header class="console-header">
        <div class="header-left">
          <div class="power-indicator">
            <span class="power-led" id="powerLed" title="主机运行中"></span>
            <span class="power-label">POWER</span>
          </div>
          <div class="console-brand">
            <span class="famicom-logo-text">FAMILY COMPUTER</span>
            <span class="cartridge-badge">WORLD 1-1 ~ 1-4 COMPLETE EDITION</span>
          </div>
        </div>

        <!-- 快速功能按钮组 (复古按键风格) -->
        <div class="console-controls">
          <button class="retro-btn" id="btnMute" title="切换声音 (M)">
            <span class="btn-icon">🔊</span>
            <span class="btn-txt">AUDIO</span>
          </button>
          <button class="retro-btn" id="btnPause" title="暂停游戏 (P)">
            <span class="btn-icon">⏸</span>
            <span class="btn-txt">PAUSE</span>
          </button>
          <button class="retro-btn" id="btnRestart" title="重开本关 (R)">
            <span class="btn-icon">🔄</span>
            <span class="btn-txt">RESET</span>
          </button>
          <button class="retro-btn active" id="btnCrt" title="切换 CRT 显像管扫描线效果">
            <span class="btn-icon">📺</span>
            <span class="btn-txt">CRT</span>
          </button>
          <button class="retro-btn" id="btnFullscreen" title="全屏沉浸模式">
            <span class="btn-icon">⛶</span>
            <span class="btn-txt">FULL</span>
          </button>
        </div>
      </header>

      <!-- 拟真曲面 CRT 显像管显示器窗口 -->
      <section class="crt-monitor" id="screenHousing">
        <div class="crt-screen-bezel">
          <!-- 核心画布 (256x240 经典 NES 点阵) -->
          <canvas id="gameCanvas" width="256" height="240"></canvas>
          
          <!-- CRT 扫描线光栅层 -->
          <div class="crt-scanlines" id="crtOverlay"></div>
          
          <!-- 球面显像管弧度高光反射层 -->
          <div class="crt-glass-glare"></div>
          
          <!-- 屏幕暗角滤镜 -->
          <div class="crt-vignette"></div>
        </div>
      </section>

      <!-- 机身装饰散热格栅与音频孔 -->
      <div class="speaker-grille">
        <span class="grille-line"></span>
        <span class="grille-line"></span>
        <span class="grille-line"></span>
        <span class="grille-line"></span>
        <span class="grille-line"></span>
      </div>

      <!-- 🎮 拟物化红白机经典控制器面板 -->
      <section class="famicom-controller">
        <!-- 控制器红金拉丝装饰板 -->
        <div class="controller-faceplate">
          
          <!-- 左侧：经典红黑十字键 (D-Pad) -->
          <div class="dpad-zone">
            <div class="dpad-housing">
              <button class="dpad-key dpad-up" id="btnUp" aria-label="上">▲</button>
              <button class="dpad-key dpad-left" id="btnLeft" aria-label="左">◀</button>
              <div class="dpad-center"></div>
              <button class="dpad-key dpad-right" id="btnRight" aria-label="右">▶</button>
              <button class="dpad-key dpad-down" id="btnDown" aria-label="下">▼</button>
            </div>
            <span class="zone-label">DIRECTION</span>
          </div>

          <!-- 中间：经典条形橡胶按键 (SELECT / START) -->
          <div class="system-buttons">
            <div class="pill-group">
              <button class="pill-btn" id="btnPillSelect">
                <span class="pill-capsule"></span>
                <span class="pill-label">SELECT</span>
              </button>
              <button class="pill-btn" id="btnPillStart">
                <span class="pill-capsule"></span>
                <span class="pill-label">START</span>
              </button>
            </div>
            <div class="controller-badge">Nintendo / Game Hub</div>
          </div>

          <!-- 右侧：倾斜排列的经典酒红色 A / B 按键 -->
          <div class="action-zone">
            <div class="action-buttons-wrap">
              <div class="action-btn-item">
                <button class="arcade-round-btn btn-b" id="btnRun">
                  <span class="btn-letter">B</span>
                </button>
                <span class="btn-subtext">RUN / DASH</span>
              </div>
              <div class="action-btn-item">
                <button class="arcade-round-btn btn-a" id="btnJump">
                  <span class="btn-letter">A</span>
                </button>
                <span class="btn-subtext">JUMP</span>
              </div>
            </div>
            <span class="zone-label">ACTION</span>
          </div>

        </div>
      </section>

      <!-- 桌面端机械键帽指南 -->
      <footer class="keyboard-cheat-sheet">
        <div class="cheat-item">
          <span class="keycap">A</span><span class="keycap">D</span> 或 <span class="keycap">←</span><span class="keycap">→</span>
          <span class="cheat-desc">移动 / 转向</span>
        </div>
        <div class="cheat-item">
          <span class="keycap">S</span> 或 <span class="keycap">↓</span>
          <span class="cheat-desc">下蹲</span>
        </div>
        <div class="cheat-item">
          <span class="keycap">K</span> / <span class="keycap">Z</span> / <span class="keycap key-space">SPACE</span>
          <span class="cheat-desc">跳跃 (长按大跳 / 轻按小跳)</span>
        </div>
        <div class="cheat-item">
          <span class="keycap">J</span> / <span class="keycap">X</span> / <span class="keycap">SHIFT</span>
          <span class="cheat-desc">加速奔跑 (按住起跳飞跃更远)</span>
        </div>
        <div class="cheat-item">
          <span class="keycap">P</span>
          <span class="cheat-desc">暂停</span>
        </div>
      </footer>

    </div>

  </main>

  <!-- 游戏脚本引用 -->
  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tilemap.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/touch.js"></script>

  <script>
    // CRT 开关切换与全屏支持
    const btnCrt = document.getElementById('btnCrt');
    const crtOverlay = document.getElementById('crtOverlay');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const screenHousing = document.getElementById('screenHousing');

    if (btnCrt && crtOverlay) {
      btnCrt.addEventListener('click', () => {
        crtOverlay.classList.toggle('disabled');
        btnCrt.classList.toggle('active', !crtOverlay.classList.contains('disabled'));
      });
    }

    if (btnFullscreen && screenHousing) {
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          screenHousing.requestFullscreen().catch(err => {
            console.warn('全屏请求失败:', err);
          });
        } else {
          document.exitFullscreen();
        }
      });
    }

    // 绑定 SELECT / START 胶囊条状按键
    const btnPillSelect = document.getElementById('btnPillSelect');
    const btnPillStart = document.getElementById('btnPillStart');
    if (btnPillSelect) {
      btnPillSelect.addEventListener('click', () => {
        const isMuted = window.marioAudio.toggleMute();
        const btnMute = document.getElementById('btnMute');
        if (btnMute) {
          btnMute.querySelector('.btn-icon').textContent = isMuted ? '🔇' : '🔊';
          btnMute.querySelector('.btn-txt').textContent = isMuted ? 'MUTED' : 'AUDIO';
        }
      });
    }
    if (btnPillStart) {
      btnPillStart.addEventListener('click', () => {
        if (!window.marioGame) return;
        if (window.marioGame.gameState === 'TITLE' || window.marioGame.gameState === 'GAME_OVER') {
          window.marioGame.startNewGame();
        } else if (window.marioGame.gameState === 'PLAYING') {
          window.marioGame.gameState = 'PAUSED';
          window.marioAudio.stopBGM();
        } else if (window.marioGame.gameState === 'PAUSED') {
          window.marioGame.gameState = 'PLAYING';
          window.marioAudio.startBGM();
        }
      });
    }
  </script>
</body>
</html>
